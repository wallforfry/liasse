name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Developer Certificate of Origin
        run: |
          unsigned=$(git log --no-merges \
            --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' \
            "$BASE_SHA..$HEAD_SHA" | awk 'NF < 2 { print $1 }')
          if [ -n "$unsigned" ]; then
            echo "These commits have no Signed-off-by trailer (use git commit -s):"
            echo "$unsigned"
            exit 1
          fi

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liasse
          POSTGRES_PASSWORD: liasse
          POSTGRES_DB: liasse_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U liasse -d liasse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://liasse:liasse@127.0.0.1:54329/liasse_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
