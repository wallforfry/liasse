name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Developer Certificate of Origin
        run: |
          scripts/check-dco.test.sh
          scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Release scripts
        run: |
          scripts/release-notes.test.sh
          scripts/release-tag.test.sh

  # A pull request that changes Markdown files only skips the Node jobs below; `format` checks it
  # instead. A push to main always runs them.
  changes:
    name: Changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" -- . ':(exclude,glob)**/*.md' | grep -q .; then
            echo code=true >>"$GITHUB_OUTPUT"
          else
            echo code=false >>"$GITHUB_OUTPUT"
          fi

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .

  check:
    name: Lint, typecheck, test, build
    needs: changes
    # `changes` is skipped on a push, which would skip this job too without `!cancelled()`.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liasse
          POSTGRES_PASSWORD: liasse
          POSTGRES_DB: liasse_test
          # Same settings as the `command` of `postgres-test` in docker-compose.dev.yml, which a
          # service container cannot set.
          POSTGRES_INITDB_ARGS: >-
            -c max_locks_per_transaction=256 -c shared_buffers=256MB
            -c fsync=off -c synchronous_commit=off
        ports:
          - 54332:5432
        # `--init`: the postmaster must not be PID 1, see `postgres-test` in docker-compose.dev.yml.
        options: >-
          --init
          --health-cmd "pg_isready -U liasse -d liasse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Same image and credentials as the `s3` service of docker-compose.dev.yml.
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: liasse
          RUSTFS_SECRET_KEY: liasse-secret
        ports:
          - 54330:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://liasse:liasse@127.0.0.1:54332/liasse_test
      TEST_S3_ENDPOINT: http://127.0.0.1:54330
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install poppler-utils (pdfinfo and pdftoppm handle scanned PDFs in the tests)
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      # Typed linting holds one TypeScript program per package. The default heap of the
      # runner is about 2 GB: main peaked near it, and the types of the MCP SDK passed it.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm typecheck
      # The tests start the real server, which refuses to start without the web UI build.
      - run: pnpm build
      - run: pnpm test

  bm25:
    name: BM25 tests (ParadeDB)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as the `paradedb` service of docker-compose.dev.yml; the port is
      # the one vitest.paradedb.config.ts connects to.
      paradedb:
        image: paradedb/paradedb:0.26.6-pg16
        env:
          POSTGRES_USER: liasse
          POSTGRES_PASSWORD: liasse
          POSTGRES_DB: liasse_test
        ports:
          - 54331:5432
        options: >-
          --init
          --health-cmd "pg_isready -h 127.0.0.1 -U liasse -d liasse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server these tests start refuses to start without the web UI build.
      - run: pnpm --filter @liasse/web build
      - run: pnpm test:paradedb
