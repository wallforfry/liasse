name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # The Release workflow, whose tag pushed with the workflow token starts no workflow.
  workflow_call:
    inputs:
      tag:
        description: The release tag (`v<version>`) to publish the image of
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only proves the image builds, on amd64, and stays under the idle memory target:
  # arm64 runs under emulation and takes several times longer, so it is built when the image is
  # published.
  build:
    name: Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: liasse:pull-request
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Idle memory
        run: scripts/check-idle-memory.sh liasse:pull-request

  publish:
    name: Publish Docker image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A release passes its tag; a pushed tag is read from the ref.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=edge,branch=main,enable=${{ !inputs.tag }}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
