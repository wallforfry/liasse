name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # With changesets pending on main, opens or updates the "version packages" pull request, which
  # bumps the versions and writes the changelogs. Once that pull request is merged, the version of
  # @liasse/server, not yet tagged, becomes a GitHub release.
  release:
    name: Version or release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm exec changeset version
          # The commit goes through the GitHub API, authored by github-actions[bot]: the DCO check
          # wants its sign-off.
          commit-message: |
            chore(release): version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          pr-title: 'chore(release): version packages'
      # Runs whether or not changesets are pending: GitHub cancels a pending run of the
      # concurrency group when a newer one arrives, so the run of the version merge may never
      # happen, and the next run, with a new changeset, must still release that version.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          tag="v$version"
          if [ "$version" = 0.0.0 ] || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Nothing to release: $tag is already tagged or no version was ever cut."
            exit 0
          fi
          # The release is the commit that cut the version, never a later commit of main.
          released="$(git log -1 --format=%H -G '"version":' -- apps/server/package.json)"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$released" 2>/dev/null || git hash-object -t tree /dev/null)"
          mapfile -t changelogs < <(git diff --name-only "$previous" "$released" -- '*CHANGELOG.md')
          if [ "${#changelogs[@]}" -eq 0 ]; then
            echo "No changelog changed up to $released, yet $tag is not tagged." >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/changelogs"
          files=()
          for changelog in "${changelogs[@]}"; do
            file="$RUNNER_TEMP/changelogs/${changelog//\//_}"
            git show "$released:$changelog" >"$file"
            files+=("$file")
          done
          scripts/release-notes.sh "${files[@]}" >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$released" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  # A tag pushed with the workflow token starts no workflow, so the release publishes its image
  # itself.
  image:
    name: Release image
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
