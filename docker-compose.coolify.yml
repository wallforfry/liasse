# Coolify: a Docker Compose application built from this repository. Coolify generates every
# SERVICE_* value once and keeps it across deployments; SERVICE_URL_LIASSE_8080 routes the
# domain set on the `liasse` service to port 8080. Fill AUTH_BOOTSTRAP_EMAIL in Coolify; any
# other variable of `.env.example` can be added there too. The models are settings saved once
# signed in (docs/deployment.md#settings).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: liasse
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: liasse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liasse -d liasse']
      interval: 5s
      timeout: 3s
      retries: 30

  liasse:
    build: .
    # Longer than the server's 30 s shutdown grace period (Docker kills after 10 s by default).
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_URL_LIASSE_8080:
      # Not SERVICE_URL_LIASSE_8080, which ends in :8080: signed file URLs need the public origin.
      PUBLIC_URL: ${SERVICE_URL_LIASSE}
      DATABASE_URL: postgres://liasse:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/liasse
      HOST: 0.0.0.0
      PORT: 8080
      # Coolify's proxy reaches the container over a Docker bridge network, in 172.16.0.0/12
      # unless Docker's address pools were changed (`docker network inspect coolify`). Its
      # forwarded headers are believed, so this holds only while no untrusted container shares
      # a network with `liasse` and the proxy rewrites X-Forwarded-For from untrusted peers
      # (Traefik's default). Add `cloudflare` when Cloudflare proxies the domain; set it empty
      # to trust no proxy. See TRUSTED_PROXIES in .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-172.16.0.0/12}
      STORAGE_PATH: /data/files
      EMBEDDING_CACHE_DIR: /data/models
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      FILE_URL_SECRET: ${SERVICE_BASE64_64_FILEURLSECRET}
      # The first account, created at the first start only: sign in to /ui with them.
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:?}
      AUTH_BOOTSTRAP_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN}
    volumes:
      - liasse-data:/data

volumes:
  postgres-data:
  liasse-data:
