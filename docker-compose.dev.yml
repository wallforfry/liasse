name: liasse-dev

services:
  # The database of the server run from source (`DATABASE_URL` of `.env.example`).
  postgres:
    image: pgvector/pgvector:pg16
    # Without an init, the postmaster is PID 1 and adopts every orphaned `docker exec` process,
    # such as a health check pg_isready whose shell was killed at the timeout under load. It
    # takes the exit code 2 of that pg_isready ("no response") for a crashed backend, ends every
    # session and runs crash recovery.
    init: true
    environment:
      POSTGRES_USER: liasse
      POSTGRES_PASSWORD: liasse
      POSTGRES_DB: liasse
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liasse -d liasse']
      interval: 2s
      timeout: 3s
      retries: 30

  # The server of `pnpm test`, apart from the one above: it holds throwaway databases only,
  # so it runs without durability. Every DROP DATABASE forces an immediate checkpoint and waits
  # for it, and with fsync a checkpoint under several suites took up to 46 s, which ended the
  # test or hook that disposed of a test database.
  postgres-test:
    image: pgvector/pgvector:pg16
    # Parallel test files each migrate a database in one transaction, which holds a lock per
    # object; the default lock table (64 per connection) ran out with several suites at once.
    # full_page_writes stays on: without it, crash recovery can fail on a page and leave a
    # server that no longer starts.
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - shared_buffers=256MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
    # The postmaster must not be PID 1, as for `postgres` above.
    init: true
    environment:
      POSTGRES_USER: liasse
      POSTGRES_PASSWORD: liasse
      POSTGRES_DB: liasse_test
    ports:
      - '127.0.0.1:54332:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liasse -d liasse_test']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible server for the tests of the s3 storage driver.
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: liasse
      RUSTFS_SECRET_KEY: liasse-secret
    ports:
      - '127.0.0.1:54330:9000'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # Postgres with ParadeDB pg_search, for the BM25 tests of `pnpm test:paradedb`. Not started by
  # `pnpm db:up`: BM25 is optional, and the tests of `pnpm test` run on `postgres-test`.
  # Started alone by `pnpm db:up:paradedb`; its databases have pg_search through template1.
  paradedb:
    image: paradedb/paradedb:0.26.6-pg16
    profiles: ['paradedb']
    # The postmaster must not be PID 1, as for `postgres` above.
    init: true
    environment:
      POSTGRES_USER: liasse
      POSTGRES_PASSWORD: liasse
      POSTGRES_DB: liasse_test
    ports:
      - '127.0.0.1:54331:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U liasse -d liasse_test']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  postgres-test-data:
  s3-data:
