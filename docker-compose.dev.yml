name: liasse-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: liasse
      POSTGRES_PASSWORD: liasse
      POSTGRES_DB: liasse
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/dev-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liasse -d liasse_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
